variables:
  GITHUB_MIRROR_REPOSITORY: RGXMods/RemoveNameplateDebuffs

include:
  - project: rgxmods/warcraft/RGX-Framework
    ref: main
    file: /.gitlab/ci/addon.yml

test:rnd:
  stage: validate
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: on_success
  script:
    - apk add --no-cache lua5.1 git
    - git clone --depth 1 https://github.com/RGXMods/RGX-Framework.git ../RGX-Framework
    - RGXFW_PATH=../RGX-Framework lua5.1 tests/OptionsLifecycle.test.lua
